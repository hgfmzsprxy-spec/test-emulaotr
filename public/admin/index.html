<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin · Payouts</title>
  <link rel="stylesheet" href="/css/admin.css?v=discord-3">
</head>
<body>
  <main class="gc-admin" id="gcAdminApp">
    <section class="gc-admin-card" id="gcAdminLogin">
      <p class="gc-admin-kicker">Script Engine</p>
      <h1>Admin</h1>
      <p>Sign in.</p>
      <button type="button" class="gc-admin-discord" id="gcAdminDiscord">
        <svg class="gc-admin-discord-icon" viewBox="0 0 127.14 96.36" aria-hidden="true">
          <path fill="currentColor" d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"></path>
        </svg>
        <span>Sign in with Discord</span>
      </button>
      <p class="gc-admin-msg" id="gcAdminLoginMsg" role="status"></p>
    </section>

    <section class="gc-admin-wrap" id="gcAdminDash" hidden>
      <header class="gc-admin-head">
        <div>
          <p class="gc-admin-kicker">Payouts</p>
          <h1>Affiliate requests</h1>
        </div>
        <button type="button" class="gc-admin-ghost" id="gcAdminLogout">Sign out</button>
      </header>
      <p class="gc-admin-msg" id="gcAdminDashMsg" role="status"></p>
      <div class="gc-admin-table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Code</th>
              <th>Amount</th>
              <th>Method</th>
              <th>Destination</th>
              <th>Requested</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="gcAdminRows">
            <tr><td colspan="7">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase-config.js"></script>
  <script src="/js/admin.js?v=discord-5"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</body>
</html>
